[project]
name = "shoreloop"
version = "0.1.0"
description = "Three-dimensional incompressible free-surface Navier-Stokes / VOF solver for a plunging breaker on a gravel beach (NVIDIA Warp)"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "warp-lang>=1.16",
    "numpy>=2.0",
    "matplotlib>=3.8",
    "scikit-image>=0.25",
    "scipy>=1.13",
    "mitsuba>=3.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.urls]
Repository = "https://github.com/VladPrytula/breaking-wave"
Post = "https://vladyslavprytula.substack.com/p/one-shore-multiple-representations"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["shoreloop*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-m", "not integration"]
markers = [
    "integration: named long-running physics scenario, run explicitly",
]
filterwarnings = ["ignore::DeprecationWarning"]
